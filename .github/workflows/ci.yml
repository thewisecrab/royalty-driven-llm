name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests

      - name: Audit installed dependencies
        run: |
          # setuptools is pinned in the dev extra. filelock's fixed releases
          # start at 4.2.1 and require Python >=3.11. OSV (2026-10-29) reports
          # every filelock release that installs on 3.10 as affected, so those
          # IDs are ignored only on 3.10. They are not ignored on 3.11+.
          if python -c 'import sys; raise SystemExit(0 if sys.version_info < (3, 11) else 1)'; then
            python -m pip_audit \
              --ignore-vuln CVE-2026-112906 \
              --ignore-vuln CVE-2026-112907 \
              --ignore-vuln CVE-2026-112908 \
              --ignore-vuln CVE-2026-112909 \
              --ignore-vuln CVE-2026-112910 \
              --ignore-vuln CVE-2026-112911 \
              --ignore-vuln CVE-2026-112912 \
              --ignore-vuln CVE-2026-112913 \
              --ignore-vuln CVE-2026-112914 \
              --ignore-vuln CVE-2026-112915 \
              --ignore-vuln CVE-2026-112934 \
              --ignore-vuln CVE-2026-112935 \
              --ignore-vuln CVE-2026-112937 \
              --ignore-vuln CVE-2026-112938 \
              --ignore-vuln CVE-2026-112939 \
              --ignore-vuln CVE-2026-112940 \
              --ignore-vuln CVE-2026-112941
          else
            python -m pip_audit
          fi

      - name: Run shipping checks
        run: |
          PYTHONPATH=src python tools/ship_check.py --skip-tests --skip-regenerate

  full-release-check:
    name: Full release check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run full ship check
        run: |
          PYTHONPATH=src python tools/ship_check.py
